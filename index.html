<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive dashboard on antibiotic resistance: WHO GLASS 2025 and The Lancet (GRAM) data.">
<title>When Antibiotics Stop Working</title>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header class="top"><h1 data-t="title"></h1><button id="lang" aria-label="Language / Langue"></button></header>
<p class="sub" data-t="intro"></p>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="1" aria-selected="true" data-t="tab1"></button>
  <button role="tab" data-tab="2" aria-selected="false" data-t="tab2"></button>
  <button role="tab" data-tab="3" aria-selected="false" data-t="tab3"></button>
</nav>

<div class="tab" id="tab-1" role="tabpanel">
  <section class="stats brief" id="brief" aria-label="Key figures"></section>
  <section class="hero" aria-live="polite">
    <svg id="dish" viewBox="0 0 340 340" role="img" aria-label="Petri dish"></svg>
    <div>
      <span class="tag" data-t="tgAll"></span>
      <div class="big" id="big"></div>
      <p class="lead" id="lead"></p>
      <div class="btns" id="btns"></div>
      <div class="legend"><i></i><span data-t="ok"></span><i class="r"></i><span data-t="res"></span></div>
    </div>
  </section>
  <section class="grid">
    <div class="card"><h2 data-t="infT"></h2><span class="tag" data-t="tgAll"></span><p class="sub" style="margin:0" data-t="infS"></p><div id="inf"></div></div>
    <div class="card"><h2 data-t="bugT"></h2><span class="tag" data-t="tgBug"></span><p class="sub" style="margin:0" data-t="bugS"></p><div id="bug"></div></div>
  </section>
  <section class="card" style="margin-top:12px">
    <h2 data-t="dthT"></h2><span class="tag" data-t="tgDth"></span>
    <p class="sub" style="margin:0 0 10px" data-t="dthS"></p>
    <div class="btns" id="dbtn"></div>
    <div id="dth"></div>
  </section>
  <section class="stats">
    <div class="card stat"><b>39 M</b><span data-t="s1"></span></div>
    <div class="card stat"><b id="s2n"></b><span data-t="s2"></span></div>
    <div class="card stat"><b>×2</b><span data-t="s3"></span></div>
  </section>
</div>

<div class="tab" id="tab-2" role="tabpanel" hidden>
  <section class="card">
    <h2 data-t="mapT"></h2><span class="tag" data-t="tgEc"></span>
    <p class="sub" style="margin:0 0 6px" data-t="mapS"></p>
    <label for="my" class="yl"><span data-t="yr"></span> : <b id="yv"></b></label><input id="my" type="range">
    <div class="mapwrap"><svg id="map" viewBox="0 0 960 500" role="img" aria-label="World map"></svg></div>
    <button id="shadow" class="shade" aria-pressed="false" data-t="shadow"></button>
    <p class="sub" id="shT" style="margin:8px 0 0"></p>
    <div id="pn" class="pn"></div>
    <div class="mgrid">
      <div><h3 data-t="rTop"></h3><div id="top"></div></div>
      <div><h3 data-t="rLow"></h3><div id="low"></div></div>
      <div><h3 data-t="rRise"></h3><div id="rise"></div></div>
    </div>
  </section>
  <section class="card" style="margin-top:12px">
    <h2 data-t="zoneT"></h2><span class="tag" data-t="tgEc"></span>
    <p class="sub" style="margin:0 0 8px" data-t="zoneS"></p>
    <div id="zones"></div>
  </section>
</div>

<div class="tab" id="tab-3" role="tabpanel" hidden>
  <section class="card">
    <h2 data-t="whyT"></h2>
    <p class="sub" style="margin:0" data-t="whyI"></p>
    <div class="why" id="wcards"></div>
  </section>
  <section class="card" style="margin-top:12px">
    <h2 data-t="scT"></h2><span class="tag" data-t="tgDrv"></span>
    <p class="sub" style="margin:0 0 8px" data-t="scS"></p>
    <div class="mapwrap"><svg id="scat" viewBox="0 0 640 350" role="img" aria-label="Scatter plot"></svg></div>
    <div class="zl" id="zl"></div>
    <p id="scr" style="margin:6px 0"></p>
    <p class="sub" id="scl" style="font-size:14px"></p>
  </section>
  <section class="card" style="margin-top:12px">
    <h2 data-t="actT"></h2>
    <p class="sub" style="margin:0" data-t="actS"></p>
    <div class="why" id="acards"></div>
  </section>
</div>

<p class="src" data-t="src"></p>
</main>
<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="geo.js"></script>
<script src="app.js"></script>
<script src="map.js"></script>
<script src="why.js"></script>
<script src="brief.js"></script>
<script>
$("lang").onclick=()=>setLang(LANG==="fr"?"en":"fr");
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  document.querySelectorAll(".tab").forEach(p=>p.hidden=p.id!=="tab-"+b.dataset.tab)});
setLang(LANG);
</script>
</body>
</html>
